# Translation System Contract

## Overview
Contract for the translation system that provides localized content based on user language preference.

## Interface
```typescript
interface TranslationSystem {
  getTranslation(key: string, language: LanguageCode): string;
  getAvailableLanguages(): LanguageInfo[];
  validateTranslations(): TranslationValidationResult;
}
```

## Language Codes
```typescript
type LanguageCode = 'EN' | 'PT';

interface LanguageInfo {
  code: LanguageCode;
  name: string;
  flag: string;
  nativeName: string;
}
```

## Translation Data Structure
```typescript
interface TranslationEntry {
  key: string;
  EN: string;
  PT: string;
  context?: string;
  lastUpdated: Date;
}

interface Translations {
  [key: string]: TranslationEntry;
}
```

## Core Translation Keys
- `hello`: Basic greeting
- `goodMorning`: Time-based morning greeting
- `goodAfternoon`: Time-based afternoon greeting
- `goodEvening`: Time-based evening greeting
- `goodNight`: Time-based night greeting
- `role`: Professional role description
- `description`: Personal description
- Navigation labels (`about`, `projects`, `experience`, `contact`)
- Form labels and validation messages
- Error messages and success notifications

## Fallback Behavior
1. If translation key doesn't exist: return the key itself
2. If language not supported: fallback to English
3. If translation is empty: fallback to English version
4. Log missing translations for future completion

## Performance Requirements
- Translation lookup: <1ms
- Memory footprint: <50KB for all translations
- Bundle size impact: Minimize unused translations in production

## Validation Contract
```typescript
interface TranslationValidationResult {
  isValid: boolean;
  missingKeys: string[];
  emptyTranslations: string[];
  inconsistentKeys: string[];
  recommendations: string[];
}
```

## Update Process
1. Add new translation keys to both languages simultaneously
2. Update `lastUpdated` timestamp
3. Run validation to ensure completeness
4. Test in both language modes
5. Deploy with feature flag if needed